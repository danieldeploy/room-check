name: Fix language highlight position

on:
  push:
    branches:
      - agent/fix-language-highlight-position

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-language-highlight-position
          fetch-depth: 0
      - name: Apply overlay positioning fix
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Fq '[highlight-position-ready]'; then exit 0; fi
          python .github/scripts/fix-language-highlight-position.py
          node --check assets/validation-feedback.js
          php -l tests/invalid-edit-ux.php
          php tests/invalid-edit-ux.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/validation-feedback.js assets/app.css tests/invalid-edit-ux.php
          git commit -m 'Anchor invalid-language highlight to textarea field [highlight-position-ready]'
          git push origin HEAD:agent/fix-language-highlight-position
