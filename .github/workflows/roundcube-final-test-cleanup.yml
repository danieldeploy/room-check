name: Final Roundcube test cleanup and legacy audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: management-hub-production
    concurrency:
      group: citycenter-smtp2go-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: 62cd8239ed21c70aa2dfe0385bfbc65ad426573c
          persist-credentials: false
      - name: Retire fixed tests and verify both live installations
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_final_test_cleanup.py
