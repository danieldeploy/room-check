name: Apply preserve invalid edits

on:
  push:
    branches:
      - agent/preserve-invalid-edits

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[invalid-edit-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-edits
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Apply patch and validate syntax
        run: |
          python3 deploy/tmp_apply_invalid_edit_patch.py
          node --check assets/app.js
          node --check assets/validation-feedback.js
          php -l rooms.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve invalid bilingual edits and guard navigation [invalid-edit-ready]'
          git push origin HEAD:agent/preserve-invalid-edits
