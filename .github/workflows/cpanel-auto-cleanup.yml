name: Automatic cPanel cache recovery
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: temporary_backup_restore_only
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptemporary_backup_restore_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Inspect installed repository status without changes
        continue-on-error: true
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_api.py status --transport whm
      - name: Analyze storage growth without modifications
        continue-on-error: true
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_deep_audit.py
      - name: Validate recovery and prune redundant backups with fixed limits
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          MYSQL_EPHEMERAL: "1"
          RESTORE_MYSQL_PASSWORD: temporary_backup_restore_only
        run: PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_backup_retention.py --apply
      - name: Recover disposable cache if disk quota above threshold
        continue-on-error: true
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_puppeteer_inventory.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_storage_inventory.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_backup_audit.py
          if ! timeout --signal=TERM --kill-after=10s 95s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_auto_cleanup.py; then
            echo "cache_cleanup_incomplete_or_timed_out; review log, do not retry blindly"
            exit 1
          fi
