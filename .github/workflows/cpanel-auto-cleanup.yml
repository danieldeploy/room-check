name: Automatic cPanel cache recovery
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  recovery:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Recover disposable cache if disk quota above threshold
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_auto_cleanup.py
