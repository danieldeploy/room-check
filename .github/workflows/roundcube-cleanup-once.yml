name: One-time Welcome Roundcube cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CLEANUP-WELCOME-EMAIL-TESTS to run the approved Welcome cleanup
        required: true
        type: string

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: codex/welcome-cleanup-20261005
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_roundcube_cleanup.py' -v
      - run: python3 -m py_compile deploy/roundcube_cleanup.py

  cleanup-welcome:
    needs: safety-tests
    if: >-
      github.repository == 'danieldeploy/room-check' &&
      github.ref == 'refs/heads/codex/roundcube-server-audit-20261004' &&
      inputs.confirm == 'CLEANUP-WELCOME-EMAIL-TESTS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: management-hub-production
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: codex/welcome-cleanup-20261005
          persist-credentials: false
      - name: Remove obsolete Welcome test artifacts with rollback safeguards
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          CONFIRM_CLEANUP: ${{ inputs.confirm }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_cleanup.py
