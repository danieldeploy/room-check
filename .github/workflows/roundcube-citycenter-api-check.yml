name: City Center public DNS and prepared transport checks
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-citycenter-api-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify only the two public SMTP2GO CNAMEs
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          pairs = [('em1063225.citycenterhostel.pt', 'return.smtp2go.net'), ('s1063225._domainkey.citycenterhostel.pt', 'dkim.smtp2go.net')]
          count = 0
          for name, expected in pairs:
              result = subprocess.run(['dig', '+short', 'CNAME', name], capture_output=True, text=True, timeout=20)
              if result.returncode == 0 and expected in [x.rstrip('.').lower() for x in result.stdout.splitlines()]:
                  count += 1
          print(json.dumps({'ok': count == 2, 'public_dns_auth_records': count, 'read_only': True, 'private_configuration_read': False, 'credentials_used': False}))
          sys.exit(0 if count == 2 else 1)
          PY

  prepared-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Lint the prepared City Center PHP plugin
        run: |
          php -l deploy/roundcube-citycenter-live/api_transport.php
          php -l deploy/roundcube-citycenter-live/citycenter_smtp2go_api.php
          php -l deploy/roundcube-citycenter-live/config.inc.php
      - name: Check envelope, duplicate protection and Sent-folder preservation without network calls
        run: php tests/test_roundcube_citycenter_live.php

  private-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: management-hub-production
    concurrency:
      group: citycenter-smtp2go-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Inspect private Roundcube configuration under explicit user authorization
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_citycenter_requirements.py

# Read-only preparation-state diagnostic; no installation attempt.

  prepare-disabled-citycenter:
    needs: [private-requirements, prepared-transport, public-dns]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: management-hub-production
    concurrency:
      group: citycenter-smtp2go-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Test the scoped operations
        run: python3 -m unittest discover -s tests -p 'test_roundcube_citycenter*.py'
      - name: Back up configuration and install the disabled plugin
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_citycenter_prepare.py
