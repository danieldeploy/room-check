name: WHM protected Puppeteer runtime and API capabilities inspection

on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/cpanel-whm-runtime-capabilities.yml
      - deploy/cpanel_whm_runtime_capabilities.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  runtime-capabilities:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Verify WHM audit cannot write or print secrets
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_whm_runtime_capabilities.py -v
      - name: Inspect processes API availability and code entrypoints using WHM
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: timeout --signal=TERM --kill-after=10s 300s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_whm_runtime_capabilities.py
