name: Fix invalid edit client

on:
  push:
    branches:
      - agent/preserve-invalid-language-edits

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-language-edits
          fetch-depth: 0
      - name: Apply client fixes
        run: |
          if git log -1 --format=%B | grep -q '\[client-ready\]'; then exit 0; fi
          python .github/scripts/fix-invalid-edit-client.py
          node --check assets/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js
          git commit -m 'Fix invalid text overlay and persisted state [client-ready]'
          git push origin HEAD:agent/preserve-invalid-language-edits
