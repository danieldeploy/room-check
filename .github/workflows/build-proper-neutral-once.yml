name: Build proper neutral once

on:
  push:
    branches:
      - agent/proper-nouns-save-latency
    paths:
      - tools/build-large-lexicons.sh
      - .github/workflows/build-proper-neutral-once.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/proper-nouns-save-latency
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build lexical resources
        run: bash tools/build-large-lexicons.sh
      - name: Commit generated resources
        run: |
          if [ -z "$(git status --porcelain -- resources/lexicon/full)" ]; then
            echo "No generated lexicon changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/lexicon/full
          git commit -m "Generate neutral proper-name lexicon"
          git push origin HEAD:agent/proper-nouns-save-latency
