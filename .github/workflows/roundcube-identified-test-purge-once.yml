name: One-shot purge identified SMTP2GO test directory
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-identified-test-purge-once.yml]
permissions:
  contents: read
jobs:
  purge:
    if: github.event.head_commit.message == 'Execute approved one-shot identified SMTP2GO test purge 20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    concurrency:
      group: identified-smtp2go-test-purge-20261009
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Remove only the identified inactive test directory once
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          EMAIL_TEST_PURGE_ONCE: '20261009-identified-smtp2go-test-only'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_identified_test_purge_once.py
