name: Address PR26 review

on:
  push:
    branches:
      - agent/preserve-invalid-language-edits

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-language-edits
          fetch-depth: 0
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -q '\[pr26-review-ready\]'; then exit 0; fi
          python .github/scripts/address-pr26-review.py
          node --check assets/app.js
          php -l tests/autosave-hardening.php
          php -l tests/invalid-language-edit-preservation.php
          php tests/autosave-hardening.php
          php tests/invalid-language-edit-preservation.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js tests/autosave-hardening.php tests/invalid-language-edit-preservation.php
          git commit -m 'Guard programmatic context changes and align autosave contract [pr26-review-ready]'
          git push origin HEAD:agent/preserve-invalid-language-edits
