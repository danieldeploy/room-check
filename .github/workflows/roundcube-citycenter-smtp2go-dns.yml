name: City Center SMTP2GO DNS

on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths:
      - .github/workflows/roundcube-citycenter-smtp2go-dns.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Test the fixed City Center DNS operation
        run: python3 -m unittest discover -s tests -p 'test_roundcube_citycenter*.py' -v
      - name: Compile the fixed DNS operation
        run: python3 -m py_compile deploy/roundcube_citycenter_smtp2go_dns.py

  apply-citycenter-dns:
    needs: safety-tests
    if: >-
      github.repository == 'danieldeploy/room-check' &&
      github.ref == 'refs/heads/codex/roundcube-server-audit-20261004' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    concurrency:
      group: citycenter-smtp2go-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Add the fixed SMTP2GO records after a private zone backup
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_citycenter_smtp2go_dns.py
