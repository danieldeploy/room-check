name: Cloudbeds mail structure inspection
on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/cloudbeds-mail-inspect.yml
      - deploy/cloudbeds_mail_inspect.py
permissions:
  contents: read
concurrency:
  group: cloudbeds-mail-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'danieldeploy/room-check'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Check restricted reads and content-free reporting
        run: python3 -m unittest discover -s tests -p test_cloudbeds_mail_inspect.py -v
      - name: Install bounded PDF reader and standard SPF diagnostic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils php-cli python3-spf
      - name: Inspect Cloudbeds MIME structure with existing hosting access
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/cloudbeds_mail_inspect.py
