name: TOConline reply route diagnosis
on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/toc-reply-diagnostic.yml
      - deploy/toc_reply_diagnostic.py
permissions:
  contents: read
concurrency:
  group: toc-reply-diagnosis
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'danieldeploy/room-check'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify read boundaries and private output
        run: python3 -m unittest discover -s tests -p test_toc_reply_diagnostic.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Inspect filters and recent replies without changing mail or Hub state
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/toc_reply_diagnostic.py
