name: Fix editable language highlight

on:
  push:
    branches:
      - agent/fix-editable-language-highlight

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-editable-language-highlight
          fetch-depth: 0
      - name: Apply editable highlight fix
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Fq '[editable-highlight-ready]'; then exit 0; fi
          python .github/scripts/fix-editable-language-highlight.py
          node --check assets/validation-feedback.js
          php -l tests/invalid-edit-ux.php
          php tests/invalid-edit-ux.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/validation-feedback.js tests/invalid-edit-ux.php
          git commit -m 'Keep invalid-language textarea editable [editable-highlight-ready]'
          git push origin HEAD:agent/fix-editable-language-highlight
