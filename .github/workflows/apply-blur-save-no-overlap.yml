name: Apply blur-only save and highlight fix

on:
  push:
    branches:
      - agent/blur-save-no-overlap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/blur-save-no-overlap
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Fq '[blur-save-ready]'; then exit 0; fi
          python .github/scripts/apply-blur-save-no-overlap.py
          node --check assets/app.js
          node --check assets/validation-feedback.js
          php -l tests/autosave-hardening.php
          php -l tests/invalid-edit-ux.php
          php tests/autosave-hardening.php
          php tests/invalid-edit-ux.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js assets/validation-feedback.js assets/app.css tests/autosave-hardening.php tests/invalid-edit-ux.php
          git commit -m 'Save textarea text on blur and avoid highlight overlap [blur-save-ready]'
          git push origin HEAD:agent/blur-save-no-overlap
