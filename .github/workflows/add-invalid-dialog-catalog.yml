name: Add invalid dialog catalog entries

on:
  push:
    branches:
      - agent/preserve-invalid-edits

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[catalog-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-edits
          fetch-depth: 0
      - name: Add catalog entries
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/I18n/SiteTranslations.php')
          s = p.read_text()
          marker = "            'Ação inválida.' => 'Invalid action.',"
          addition = """            'Ação inválida.' => 'Invalid action.',\n            'Tem texto errado em Inglês. Quer corrigir, ou anular a edição?' => 'There is text incorrectly written in Portuguese. Do you want to correct it or cancel the edit?',\n            'Anular edição' => 'Cancel edit',"""
          if "'Tem texto errado em Inglês. Quer corrigir, ou anular a edição?' =>" not in s:
              if marker not in s:
                  raise SystemExit('catalog marker not found')
              p.write_text(s.replace(marker, addition, 1))
          Path('.github/workflows/add-invalid-dialog-catalog.yml').unlink()
          PY
          php -l src/I18n/SiteTranslations.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register invalid edit dialog translations [catalog-ready]'
          git push origin HEAD:agent/preserve-invalid-edits
