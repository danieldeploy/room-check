name: One-off historical error-log retention

on:
  push:
    branches: [agent/room-item-assignments]
    paths: [.github/workflows/cpanel-old-log-reclaim.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  retire-old-log:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: management-hub-production
    steps:
      - name: Checkout the reviewed production commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test exact file selection, age limits and fail-closed behavior
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_historical_log_cleanup.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_npm_finisher.py -v
      - name: Audit old error logs without reading their contents
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout 90s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_historical_log_cleanup.py
      - name: Diagnose Fileman access to the historical error log (read-only)
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 120s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_log_access_probe.py
      - name: Verify after deletion and other disk categories without modifications
        if: always()
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_historical_log_cleanup.py
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_deep_audit.py
