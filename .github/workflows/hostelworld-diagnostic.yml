name: Hostelworld deployment diagnosis
on:
  push:
    branches: [agent/room-item-assignments]
    paths: [.github/workflows/hostelworld-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Read bounded City authentication status
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import sys,json,os,urllib.parse,urllib.request
          sys.path.insert(0,'deploy')
          from cpanel_api import Config,CpanelAPI,WHM_ORIGIN
          config=Config(token=os.environ['WHM_API_TOKEN'],transport='whm',origin=WHM_ORIGIN)
          api=CpanelAPI(config)
          query=urllib.parse.urlencode({'api.version':1,'cpanel.user':'city','cpanel.module':'Fileman',
              'cpanel.function':'get_file_content','dir':'/home/city','file':'hostelworld-city-auth-status.json'})
          req=urllib.request.Request(WHM_ORIGIN+'/json-api/uapi_cpanel?'+query,
              headers={'Authorization':'whm fazenda:'+config.token})
          with api.opener.open(req,timeout=20) as r: data=json.loads(r.read(65536))
          result=data.get('data',{}).get('uapi',{})
          if result.get('status')!=1:
              print(json.dumps({'city_auth_status':'not_available'})); sys.exit(0)
          value=result.get('data',{})
          if isinstance(value,list): value=value[0]
          try: facts=json.loads(value.get('content',''))
          except Exception:
              print(json.dumps({'city_auth_status':'invalid'})); sys.exit(0)
          stages=['started','parse_error','message_not_matched','message_matched','transport_error','hub_response','configuration_error']
          clean={'stage':facts.get('stage') if facts.get('stage') in stages else 'invalid'}
          for key in ['at','http_status']:
              if type(facts.get(key)) is int: clean[key]=facts[key]
          if type(facts.get('accepted')) is bool: clean['accepted']=facts['accepted']
          print(json.dumps({'city_auth_status':clean}))
          PYCODE
