name: Roundcube completion read-only audit
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-completion-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: management-hub-production
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: b3886dad591f3939ba8e01fe9494e297043e5e46
      - name: Read approved metadata without credentials or server changes
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import sys,os,json,re,hashlib,subprocess
          sys.path.insert(0,'deploy')
          from roundcube_audit import Client
          c=Client(os.environ['WHM_API_TOKEN'])
          def api(u,m,f,**kw):
           return c.request('/json-api/uapi_cpanel',{'api.version':1,'cpanel.user':u,'cpanel.module':m,'cpanel.function':f,**kw},3)
          def read(u,d,f):
           r=api(u,'Fileman','get_file_content',dir=d,file=f,from_charset='UTF-8',to_charset='UTF-8')
           if not isinstance(r,dict) or not isinstance(r.get('content'),str):raise ValueError()
           return r['content']
          rows=[]
          for u,pname in [('welcome','welcome_smtp2go_api'),('city','citycenter_smtp2go_api')]:
           root='/home/'+u+'/public_html/roundcube'; row={'installation':u}
           def attempt(k,fn):
            try:row[k]=fn()
            except Exception:row[k]='unavailable'
           cfg=read(u,root+'/config','config.inc.php')
           def plugin_shape():
            php=r"""$ts=token_get_all(stream_get_contents(STDIN));$code='';foreach($ts as $t){if(is_array($t)&&in_array($t[0],[T_COMMENT,T_DOC_COMMENT]))continue;$code.=is_array($t)?$t[1]:$t;}preg_match_all('/\\$config\\s*\\[\\s*[\x27\x22]plugins[\x27\x22]\\s*\\][^;]*;/s',$code,$m);$out=[];foreach($m[0] as $s){preg_match_all('/[\x27\x22]([a-z][a-z0-9_]{0,70})[\x27\x22]/',$s,$v);preg_match_all('/\\b(array_merge|array_values|array_unique|array_diff|array_filter)\\s*\\(/',$s,$f);$out[]=['names'=>array_values(array_filter($v[1],fn($n)=>$n!=='plugins')),'functions'=>$f[1],'append'=>boolval(preg_match('/\\]\\s*\\[\\s*\\]\\s*=/',$s))];}echo json_encode($out);"""
            r=subprocess.run(['php','-r',php],input=cfg,text=True,capture_output=True,timeout=10)
            if r.returncode:raise ValueError()
            return json.loads(r.stdout)
           attempt('plugin_declarations',plugin_shape)
           rows.append(row)
          print(json.dumps({'writes':False,'results':rows}))
          PY
