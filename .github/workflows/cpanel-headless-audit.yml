name: Inspect installed Puppeteer versions and cron dependencies (read only)

on:
  push:
    branches: [agent/room-item-assignments]
    paths: [.github/workflows/cpanel-headless-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: management-hub-production
    steps:
      - name: Checkout reviewed production code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Run scope and confidentiality regression tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_headless_dependency_audit.py -v
      - name: Inspect Puppeteer binaries and cPanel crons without modifying anything
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 240s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_headless_dependency_audit.py
      - name: Check quota and browser sizes after read-only inspection
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_deep_audit.py
