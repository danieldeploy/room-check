name: Probe language hardening

on:
  push:
    branches:
      - agent/autosave-language-guard-hardening

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autosave-language-guard-hardening
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Probe PT EN scores
        run: |
          php <<'PHP'
          <?php
          require __DIR__ . '/src/ThirdParty/efficient-language-detector/manual_loader.php';
          use Nitotm\Eld\EldMode;
          use Nitotm\Eld\EldScheme;
          use Nitotm\Eld\LanguageDetector;
          $d = new LanguageDetector('small_2_1niz1ni', EldScheme::ISO639_1, EldMode::MODE_ARRAY);
          $cases = [
            'bloco','terreno','barco','nuvem','escada','quarto','espelho','cozinha','limpeza','janela','cama','porta','parede','cortina',
            'block','land','boat','cloud','stairs','room','mirror','kitchen','cleaning','window','bed','door','wall','curtain',
            'café','hotel','hostel','item','online','offline','central','lisboa','porto','welcome','wifi','netflix','booking','airbnb','tv','minibar',
            'Check that it is clean and undamaged. bloco','Check that it is clean and undamaged. terreno','Check that it is clean and undamaged. nuvem',
            'Verificar se está limpo e sem danos. block','Verificar se está limpo e sem danos. cloud'
          ];
          foreach ($cases as $text) {
              $r = $d->detect($text);
              echo $text . "\tlang=" . $r->language . "\treliable=" . ($r->isReliable() ? 'yes' : 'no') . "\tscores=" . json_encode($r->scores(), JSON_UNESCAPED_UNICODE) . "\n";
          }
          PHP
