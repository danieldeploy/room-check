name: Probe language hardening

on:
  push:
    branches:
      - agent/autosave-language-guard-hardening

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autosave-language-guard-hardening
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Build and probe large PT EN subset
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          composer init --name=room-check/probe --no-interaction
          composer require nitotm/efficient-language-detector:3.2.0 --prefer-dist --no-interaction
          cat > probe.php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';
          use Nitotm\Eld\EldMode;
          use Nitotm\Eld\EldScheme;
          use Nitotm\Eld\LanguageDetector;

          $builder = new LanguageDetector('large', EldScheme::ISO639_1, EldMode::MODE_ARRAY);
          $subset = $builder->langSubset(['en', 'pt'], true, true);
          if (!$subset->success || !$subset->file) {
              throw new RuntimeException($subset->error ?? 'Could not build subset');
          }
          echo "subset=" . $subset->file . "\n";
          $d = new LanguageDetector($subset->file, EldScheme::ISO639_1, EldMode::MODE_ARRAY);
          $cases = [
            'bloco','terreno','barco','nuvem','escada','quarto','espelho','cozinha','limpeza','janela','cama','porta','parede','cortina',
            'block','land','boat','cloud','stairs','room','mirror','kitchen','cleaning','window','bed','door','wall','curtain',
            'café','hotel','hostel','item','online','offline','central','lisboa','porto','welcome','wifi','netflix','booking','airbnb','tv','minibar'
          ];
          foreach ($cases as $text) {
              $r = $d->detect($text);
              echo $text . "\tlang=" . $r->language . "\treliable=" . ($r->isReliable() ? 'yes' : 'no') . "\tscores=" . json_encode($r->scores(), JSON_UNESCAPED_UNICODE) . "\n";
          }
          PHP
          php probe.php
