name: Protected ZKAccess backup cron bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/agent/zkaccess-archive-independent-fix-20261030'
    runs-on: ubuntu-latest
    environment: management-hub-production
    timeout-minutes: 5
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Validate private worker and command
        run: |
          python3 -m py_compile deploy/zkaccess_archive_bootstrap.py
          python3 -m unittest discover -s tests -p test_zkaccess_backup_cron.py -v
      - name: Install worker and dedicated cron without public deployment
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/zkaccess_archive_bootstrap.py install
      - name: Verify worker and cron
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/zkaccess_archive_bootstrap.py inspect
