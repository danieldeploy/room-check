name: One-off audited backup and npm cache cleanup

on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/cpanel-backup-npm-cleanup-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: management-hub-production
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: temporary_backup_restore_only
        options: >-
          --health-cmd="mysqladmin ping -uroot -ptemporary_backup_restore_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout reviewed production commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Test backup retention, stale NPM cache and log protections
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_backup_retention.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_npm_finisher.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_historical_log_cleanup.py -v
      - name: Read-only inventory before cleanup
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 160s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_deep_audit.py
      - name: Retain verified backups and remove only eligible same-period duplicates
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          MYSQL_EPHEMERAL: "1"
          RESTORE_MYSQL_PASSWORD: temporary_backup_restore_only
        run: |
          timeout --signal=TERM --kill-after=10s 420s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_backup_retention.py --apply
      - name: Delete only aged verified NPM content cache and inspect logs without deletion
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 160s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_npm_finisher.py --apply
      - name: Confirm old log eligibility, never touch recent active logs
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 120s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_historical_log_cleanup.py
      - name: Final storage inventory after any cleanup
        if: always()
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 160s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_deep_audit.py
