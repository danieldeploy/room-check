name: Apply invalid language edit preservation

on:
  push:
    branches:
      - agent/preserve-invalid-language-edits

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[invalid-edit-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-language-edits
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Patch and validate
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-invalid-text-preservation.py')
          s = p.read_text()
          ci = """p = Path('.github/workflows/ci.yml')\ns = p.read_text()\nold = '          php tests/autosave-hardening.php\\n'\nif old not in s:\n    raise SystemExit('CI autosave test line missing')\np.write_text(s.replace(old, old + '          php tests/invalid-language-edit-preservation.php\\n', 1))\n\n"""
          if ci not in s:
              raise SystemExit('CI patch block missing from helper script')
          s = s.replace(ci, '')
          s = s.replace("Path('.github/workflows/apply-invalid-text-preservation.yml').unlink(missing_ok=True)\n", '')
          p.write_text(s)
          PY
          python .github/scripts/apply-invalid-text-preservation.py
          node --check assets/app.js
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/invalid-language-edit-preservation.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve invalid language edits and guard navigation [invalid-edit-ready]'
          git push origin HEAD:agent/preserve-invalid-language-edits
