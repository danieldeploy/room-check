name: Keep language pending flag

on:
  push:
    branches:
      - agent/preserve-invalid-edits

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[pending-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-edits
          fetch-depth: 0
      - name: Keep validation pending until server success
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('assets/validation-feedback.js')
          s = p.read_text()
          s = s.replace(
              "        textarea.classList.add('language-invalid');\n        textarea.setAttribute('aria-invalid', 'true');",
              "        textarea.classList.add('language-invalid');\n        textarea.dataset.languageNeedsValidation = '1';\n        textarea.setAttribute('aria-invalid', 'true');",
              1
          )
          s = s.replace(
              "            textarea.dataset.lastValidValue = textarea.value;\n            removeHighlight(textarea);",
              "            textarea.dataset.lastValidValue = textarea.value;\n            delete textarea.dataset.languageNeedsValidation;\n            removeHighlight(textarea);",
              1
          )
          s = s.replace(
              "            textarea.value = textarea.dataset.lastValidValue ?? '';\n            removeHighlight(textarea);",
              "            textarea.value = textarea.dataset.lastValidValue ?? '';\n            delete textarea.dataset.languageNeedsValidation;\n            removeHighlight(textarea);",
              1
          )
          old = "    const invalidTextareas = () => Array.from(document.querySelectorAll('.check-row textarea.language-invalid'));"
          new = """    const invalidTextareas = () => Array.from(document.querySelectorAll(\n        '.check-row textarea.language-invalid, .check-row textarea[data-language-needs-validation=\"1\"]'\n    ));"""
          if old not in s:
              raise SystemExit('invalidTextareas pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/invalid-edit-ux.php')
          ts = t.read_text()
          needle = "assertInvalidEditUx(str_contains($feedback, \"textarea.dataset.lastValidValue\"), 'last server-confirmed value is retained for cancel edit');"
          addition = needle + "\nassertInvalidEditUx(str_contains($feedback, \"textarea.dataset.languageNeedsValidation = '1'\"), 'rejected edit remains pending until server validation succeeds');\nassertInvalidEditUx(str_contains($feedback, 'data-language-needs-validation'), 'navigation also guards a correction that has not yet been revalidated');"
          if 'rejected edit remains pending until server validation succeeds' not in ts:
              if needle not in ts:
                  raise SystemExit('test insertion marker not found')
              t.write_text(ts.replace(needle, addition, 1))

          Path('.github/workflows/persist-language-pending-flag.yml').unlink()
          PY
          node --check assets/validation-feedback.js
          php -l tests/invalid-edit-ux.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Keep rejected edits pending until revalidated [pending-ready]'
          git push origin HEAD:agent/preserve-invalid-edits
