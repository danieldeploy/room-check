name: Inspect City Hostelworld filter preconditions
on:
  push:
    branches: [agent/room-item-assignments]
    paths: [.github/workflows/hostelworld-city-refresh.yml]
permissions:
  contents: read
concurrency:
  group: management-hub-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Inspect regeneration preconditions without changing the server
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import sys,io,contextlib,json
          sys.path.insert(0,'deploy')
          from hostelworld_filters import FilterAPI,NAME,expected,rows,verify_filter
          from cpanel_api import DeploymentError
          try:
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  current=rows(FilterAPI('city').call('Email','list_filters'))
          except Exception:
              print('{"city_filter_inspection":{"available":false}}')
              sys.exit(1)
          facts={'available':True,'single_rule':len(current)==1}
          if len(current)==1:
              rule=current[0]; params=expected('city',3)
              facts.update(own_rule=rule.get('filtername')==NAME,
                  disabled=bool(rule.get('disabled')),
                  two_conditions=len(rule.get('rules',[]))==2,
                  two_actions=len(rule.get('actions',[]))==2)
              facts['conditions']=[{key:r.get(key)==params.get(key+str(i))
                  for key in ('part','match','val','opt')}
                  for i,r in enumerate(rule.get('rules',[]),1)]
              try:
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      verify_filter(rule,params)
                  facts['verified']=True
              except DeploymentError as error:
                  facts['verified']=False
                  allowed={'filter_disabled','filter_conflict','filter_rule_conflict','filter_destination_conflict'}
                  facts['reason']=str(error) if str(error) in allowed else 'unclassified'
          print(json.dumps({'city_filter_inspection':facts}))
          PYCODE
