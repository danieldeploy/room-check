name: Roundcube web runtime and preferences audit
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-web-restore-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: management-hub-production
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: 3eb2e3fe101d1dfb4d216a0ad97f5b361f0bc033
      - name: Prepare isolated recovery test
        run: |
          cat > /tmp/restore.php <<'CODE'
          <?php
          ini_set('display_errors','0');ini_set('log_errors','0');
          if ($_SERVER['REQUEST_METHOD']!=='POST'||time()>__EXPIRY__||!hash_equals('__TOKENHASH__',hash('sha256',$_SERVER['HTTP_X_AUDIT_TOKEN']??''))) {http_response_code(404);exit;}
          header('Content-Type: application/json');header('Cache-Control: no-store');
          if(!unlink(__FILE__)){http_response_code(500);exit;}
          umask(0077);set_time_limit(240);ob_start();$stage='preflight';$restored=null;$complete=false;
          function check($ok){if(!$ok)throw new RuntimeException('check_failed');}
          function identifier($s){check(is_string($s)&&preg_match('/^[a-zA-Z0-9_]+$/D',$s));return '`'.$s.'`';}
          function putline($h,$a){$s=json_encode($a,JSON_THROW_ON_ERROR)."\n";check(fwrite($h,$s)===strlen($s));}
          function row_hash($row){$a=[];foreach($row as $v)$a[]=is_null($v)?null:base64_encode((string)$v);return hash('sha256',json_encode($a,JSON_THROW_ON_ERROR));}
          function erase_tree($p){check(!is_link($p));foreach(new FilesystemIterator($p,FilesystemIterator::SKIP_DOTS) as $f){check(!$f->isLink());if($f->isDir())erase_tree($f->getPathname());else check(unlink($f->getPathname()));}check(rmdir($p));}
          try{
           $root=__DIR__;$home=dirname(dirname($root));check($home==='/home/__ACCOUNT__');
           define('RCUBE_INSTALL_PATH',$root.'/');define('INSTALL_PATH',$root.'/');$config=[];require $root.'/config/defaults.inc.php';require $root.'/config/config.inc.php';
           $dsn=parse_url($config['db_dsnw']);check(($dsn['scheme']??'')==='mysql'&&($dsn['host']??'')==='localhost');$db=rawurldecode(ltrim($dsn['path'],'/'));identifier($db);
           $input=json_decode(file_get_contents('php://input'),true,512,JSON_THROW_ON_ERROR);$testdb='__TESTDB__';check($testdb!==$db&&$input['database']===$testdb&&$input['user']===$testdb);identifier($testdb);
           $opts=[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_EMULATE_PREPARES=>false,PDO::ATTR_STRINGIFY_FETCHES=>true];
           $src=new PDO('mysql:host=localhost;dbname='.$db.';charset=utf8mb4',rawurldecode($dsn['user']),rawurldecode($dsn['pass']),$opts);
           $dst=new PDO('mysql:host=localhost;dbname='.$testdb.';charset=utf8mb4',$input['user'],$input['password'],$opts);unset($input);
           check($dst->query('SHOW TABLES')->fetchColumn()===false);
           $tables=$src->query('SHOW TABLE STATUS')->fetchAll(PDO::FETCH_ASSOC);check(count($tables)===17);foreach($tables as $t){identifier($t['Name']);check($t['Engine']==='InnoDB');}
           check((int)$src->query('SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA=DATABASE()')->fetchColumn()===0);
           $base=$home.'/roundcube-recovery-__STAMP__';check(!file_exists($base)&&!is_link($base));check(mkdir($base,0700));check(disk_free_space($base)>512*1024*1024);
           $stage='application_backup';$zip=new ZipArchive();check($zip->open($base.'/application.zip',ZipArchive::CREATE|ZipArchive::EXCL)===true);$manifest=[];$excluded=0;$bytes=0;
           $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($root,FilesystemIterator::SKIP_DOTS),RecursiveIteratorIterator::SELF_FIRST);
           foreach($it as $f){$path=$f->getPathname();$rel=substr($path,strlen($root)+1);check(!$f->isLink());check(!str_contains($rel,'..')&&!str_starts_with($rel,'/'));
            if(preg_match('~^(logs|temp)/~',$rel)&&!str_ends_with($rel,'/.htaccess')){$excluded++;continue;}
            if($f->isDir()){check($zip->addEmptyDir($rel));$manifest[$rel]=['dir'=>true,'mode'=>$f->getPerms()&0777];continue;}
            check($f->isFile());$data=file_get_contents($path);check($data!==false);$bytes+=strlen($data);check($bytes<300*1024*1024);
            check($zip->addFromString($rel,$data));$manifest[$rel]=['sha256'=>hash('sha256',$data),'mode'=>$f->getPerms()&0777];unset($data);
           }
           check($zip->close());check(chmod($base.'/application.zip',0600));
           $stage='private_backup';$private=$home.'/__PRIVATE__';check(is_dir($private)&&!is_link($private));$privzip=new ZipArchive();check($privzip->open($base.'/transport-private.zip',ZipArchive::CREATE|ZipArchive::EXCL)===true);$privateManifest=[];
           $paths=[$private.'/__KEY__'];check(is_dir($private.'/live')&&!is_link($private.'/live'));
           foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator($private.'/live',FilesystemIterator::SKIP_DOTS)) as $f){check(!$f->isLink());if($f->isFile())$paths[]=$f->getPathname();}
           foreach($paths as $p){check(is_file($p)&&!is_link($p));$rel=substr($p,strlen($private)+1);$data=file_get_contents($p);check($data!==false);check($privzip->addFromString($rel,$data));$privateManifest[$rel]=hash('sha256',$data);unset($data);}
           check($privzip->close());check(chmod($base.'/transport-private.zip',0600));
           $stage='database_backup';$fh=fopen($base.'/database.jsonl','x');check($fh!==false);$sql=fopen($base.'/database.sql','x');check($sql!==false);
           fwrite($sql,"SET NAMES utf8mb4;\nSET FOREIGN_KEY_CHECKS=0;\n");
           $src->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$src->exec('SET TRANSACTION READ ONLY');$src->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT');$expected=[];$rowCount=0;
           foreach($tables as $t){$name=$t['Name'];$q=identifier($name);$ddl=$src->query('SHOW CREATE TABLE '.$q)->fetch(PDO::FETCH_NUM)[1];
            check(str_starts_with($ddl,'CREATE TABLE '.$q.' '));putline($fh,['table'=>$name,'ddl'=>base64_encode($ddl)]);fwrite($sql,$ddl.";\n");$hashes=[];
            $stmt=$src->query('SELECT * FROM '.$q);$cols=null;
            while($row=$stmt->fetch(PDO::FETCH_ASSOC)){$rowCount++;check($rowCount<200000);$hashes[]=row_hash(array_values($row));$enc=[];$values=[];
             foreach($row as $k=>$v){identifier($k);$enc[$k]=is_null($v)?null:base64_encode((string)$v);$values[]=is_null($v)?'NULL':"X'".bin2hex((string)$v)."'";}
             putline($fh,['row'=>$enc]);fwrite($sql,'INSERT INTO '.$q.' ('.implode(',',array_map('identifier',array_keys($row))).') VALUES ('.implode(',',$values).");\n");
            }
            sort($hashes);$expected[$name]=['count'=>count($hashes),'hash'=>hash('sha256',implode('',$hashes))];
           }
           $src->commit();fwrite($sql,"SET FOREIGN_KEY_CHECKS=1;\n");check(fclose($fh));check(fclose($sql));chmod($base.'/database.jsonl',0600);chmod($base.'/database.sql',0600);
           $stage='application_restore';$restored=$base.'/restore-test';check(mkdir($restored,0700));check($zip->open($base.'/application.zip')===true);check($zip->extractTo($restored.'/application'));$zip->close();$matched=0;
           foreach($manifest as $rel=>$v){$p=$restored.'/application/'.$rel;check(!is_link($p));if(isset($v['sha256'])){check(is_file($p)&&hash_file('sha256',$p)===$v['sha256']);$matched++;check(hash_file('sha256',$root.'/'.$rel)===$v['sha256']);}else check(is_dir($p));check(chmod($p,$v['mode']));}
           check($privzip->open($base.'/transport-private.zip')===true);check($privzip->extractTo($restored.'/private'));$privzip->close();foreach($privateManifest as $rel=>$hash)check(hash_file('sha256',$restored.'/private/'.$rel)===$hash);
           $stage='database_restore';$dst->exec('SET FOREIGN_KEY_CHECKS=0');$fh=fopen($base.'/database.jsonl','r');$current=null;
           while(($line=fgets($fh))!==false){$v=json_decode($line,true,512,JSON_THROW_ON_ERROR);if(isset($v['table'])){$current=$v['table'];identifier($current);$dst->exec(base64_decode($v['ddl'],true));continue;}
            check($current!==null);$row=$v['row'];$columns=array_keys($row);$statement=$dst->prepare('INSERT INTO '.identifier($current).' ('.implode(',',array_map('identifier',$columns)).') VALUES ('.implode(',',array_fill(0,count($row),'?')).')');$vals=[];foreach($row as $x)$vals[]=is_null($x)?null:base64_decode($x,true);$statement->execute($vals);
           }fclose($fh);$dst->exec('SET FOREIGN_KEY_CHECKS=1');
           foreach($expected as $table=>$e){$hashes=[];$stmt=$dst->query('SELECT * FROM '.identifier($table));while($row=$stmt->fetch(PDO::FETCH_NUM))$hashes[]=row_hash($row);sort($hashes);check(count($hashes)===$e['count']&&hash('sha256',implode('',$hashes))===$e['hash']);}
           $stage='record';$report=['ok'=>true,'backup_directory'=>$base,'application_files_verified'=>$matched,'database_tables_verified'=>count($expected),'database_rows_verified'=>$rowCount,'private_files_verified'=>count($privateManifest),'volatile_entries_excluded'=>$excluded,'restored_data_matches_snapshot'=>true,'application_originals_unchanged'=>true,'production_database_writes'=>false,'test_database_separate'=>true,'mail_sent'=>false,'functional_login_tested'=>false];
           check(file_put_contents($base.'/manifest.json',json_encode(['files'=>$manifest,'private_files'=>$privateManifest,'tables'=>$expected,'report'=>$report],JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR))!==false);
           $stage='cleanup';erase_tree($restored);$restored=null;$report['restore_directory_removed']=true;$complete=true;check(file_put_contents($base.'/result.json',json_encode($report,JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR))!==false);ob_end_clean();echo json_encode($report,JSON_THROW_ON_ERROR);
          }catch(Throwable $e){if(ob_get_level())ob_end_clean();http_response_code(500);echo json_encode(['ok'=>false,'stage'=>$stage,'error_class'=>get_class($e),'line'=>$e->getLine(),'backup_complete'=>$complete]);}
          finally{if($restored!==null&&is_dir($restored)){try{erase_tree($restored);}catch(Throwable $ignored){}}}
          CODE
          cat > /tmp/driver.py <<'CODE'
          import os,sys,json,time,secrets,hashlib,ssl,urllib.request,urllib.parse
          from pathlib import Path
          sys.path.insert(0,'deploy')
          from roundcube_audit import Client,NoRedirects
          c=Client(os.environ['WHM_API_TOKEN'])
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirects(),urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          def api(u,m,f,**args):
           p={'api.version':1,'cpanel.user':u,'cpanel.module':m,'cpanel.function':f,**args}
           req=urllib.request.Request('https://server50.romania-webhosting.com:2087/json-api/uapi_cpanel',data=urllib.parse.urlencode(p).encode(),headers={'Authorization':'whm fazenda:'+c.token,'Accept':'application/json'})
           with opener.open(req,timeout=40) as r: v=json.load(r)
           if v.get('metadata',{}).get('result')!=1:raise RuntimeError('whm_failed')
           v=v.get('data',{}).get('uapi',{})
           if v.get('status')!=1 or v.get('errors'):raise RuntimeError('uapi_failed')
           return v.get('data')
          def names(u,root):
           v=api(u,'Fileman','list_files',dir=root)
           if isinstance(v,dict):v=v.get('files')
           if not isinstance(v,list):raise RuntimeError('listing_failed')
           return {x['file'] for x in v}
          def remove(u,root,name):
           if name not in names(u,root):return
           v=c.request('/json-api/cpanel',{'cpanel_jsonapi_user':u,'cpanel_jsonapi_apiversion':2,'cpanel_jsonapi_module':'Fileman','cpanel_jsonapi_func':'fileop','op':'unlink','sourcefiles':root+'/'+name,'doubledecode':0},2)
           if name in names(u,root):raise RuntimeError('temporary_probe_cleanup_failed')
          def safe_error(e):
           if not isinstance(e,urllib.error.HTTPError):return None
           try:
            v=json.loads(e.read(8192))
            return {k:v[k] for k in ('ok','stage','error_class','line') if k in v and isinstance(v[k],(str,int,bool))}
           except Exception:return None
          failed=False
          for u,domain,private,key in [('welcome','welcomehostel.pt','roundcube-smtp2go-private','sandbox-key.txt'),('city','citycenterhostel.pt','roundcube-smtp2go-citycenter-private','api-key.txt')]:
           root='/home/'+u+'/public_html/roundcube'; name='rc-restore-audit-'+secrets.token_hex(12)+'.php'; token=secrets.token_hex(32)
           suffix=secrets.token_hex(3); testdb=u+'_rct'+suffix; password=secrets.token_hex(24); stamp=time.strftime('%Y%m%dT%H%M%SZ',time.gmtime())+'-'+suffix
           source=Path('/tmp/restore.php').read_text()
           for a,b in {'__EXPIRY__':str(int(time.time())+600),'__TOKENHASH__':hashlib.sha256(token.encode()).hexdigest(),'__ACCOUNT__':u,'__TESTDB__':testdb,'__STAMP__':stamp,'__PRIVATE__':private,'__KEY__':key}.items():source=source.replace(a,b)
           made_db=False;made_user=False;stage='preflight'
           try:
            assert name not in names(u,root)
            stage='create_test_database';api(u,'Mysql','create_database',name=testdb);made_db=True
            stage='create_test_user';api(u,'Mysql','create_user',name=testdb,password=password);made_user=True
            stage='grant_test_only';api(u,'Mysql','set_privileges_on_database',user=testdb,database=testdb,privileges='ALL PRIVILEGES')
            stage='upload_guarded_probe';api(u,'Fileman','save_file_content',dir=root,file=name,content=source,from_charset='UTF-8',to_charset='UTF-8')
            stage='backup_restore';req=urllib.request.Request('https://'+domain+'/roundcube/'+name,data=json.dumps({'database':testdb,'user':testdb,'password':password}).encode(),headers={'X-Audit-Token':token,'Content-Type':'application/json'})
            with opener.open(req,timeout=280) as r:result=json.load(r)
            if not result.get('ok'):raise RuntimeError('restore_failed')
            print('RESTORE_AUDIT='+json.dumps({'installation':u,'result':result},sort_keys=True),flush=True)
           except Exception as e:
            failed=True; print('RESTORE_AUDIT='+json.dumps({'installation':u,'ok':False,'stage':stage,'error_class':type(e).__name__,'http_status':getattr(e,'code',None),'diagnostic':safe_error(e)}),flush=True)
           finally:
            clean={'installation':u}
            try:remove(u,root,name);clean['probe_absent']=name not in names(u,root)
            except Exception:clean['probe_absent']=False;failed=True
            if made_db:
             try:api(u,'Mysql','delete_database',name=testdb);clean['test_database_removed']=True
             except Exception:clean['test_database_removed']=False;failed=True
            if made_user:
             try:api(u,'Mysql','delete_user',name=testdb);clean['test_user_removed']=True
             except Exception:clean['test_user_removed']=False;failed=True
            print('RESTORE_CLEANUP='+json.dumps(clean),flush=True)
          if failed:sys.exit(1)
          CODE
          python3 -m py_compile /tmp/driver.py
          php -l /tmp/restore.php
      - name: Backup privately restore in separate database and remove temporary resources
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: python3 /tmp/driver.py

