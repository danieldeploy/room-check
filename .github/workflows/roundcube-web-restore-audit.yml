name: Roundcube web runtime and preferences audit
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-web-restore-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: management-hub-production
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: 3eb2e3fe101d1dfb4d216a0ad97f5b361f0bc033
      - name: Prepare final private backup inventory and scoped incomplete-attempt cleanup
        run: |
          cat > /tmp/cleanup.php <<'CODE'
          <?php
          ini_set('display_errors','0');ini_set('log_errors','0');
          if($_SERVER['REQUEST_METHOD']!=='POST'||time()>__EXPIRY__||!hash_equals('__TOKENHASH__',hash('sha256',$_SERVER['HTTP_X_AUDIT_TOKEN']??''))){http_response_code(404);exit;}
          header('Content-Type: application/json');header('Cache-Control: no-store');if(!unlink(__FILE__)){http_response_code(500);exit;}
          $home=dirname(dirname(__DIR__));$removed=0;$backups=[];$incomplete=0;
          try{
           foreach(new FilesystemIterator($home,FilesystemIterator::SKIP_DOTS) as $f){$name=$f->getFilename();if(!preg_match('/^roundcube-recovery-20261013T14[0-9]{4}Z-[a-f0-9]{6}$/D',$name)||$f->isLink()||!$f->isDir())continue;
            $p=$f->getPathname();$names=array_values(array_diff(scandir($p),['.','..']));sort($names);
            if(!array_diff($names,['application.zip','transport-private.zip','database.jsonl','database.sql'])){foreach($names as $n){if(is_link($p.'/'.$n)||!is_file($p.'/'.$n))throw new Exception();if(!unlink($p.'/'.$n))throw new Exception();}if(!rmdir($p))throw new Exception();$removed++;continue;}
            if(is_file($p.'/result.json')){$report=json_decode(file_get_contents($p.'/result.json'),true);$modes=[];foreach(['application.zip','transport-private.zip','database.jsonl','database.sql','manifest.json','result.json'] as $n){if(!is_file($p.'/'.$n)||is_link($p.'/'.$n))throw new Exception();$modes[$n]=decoct(fileperms($p.'/'.$n)&0777);}$backups[]=['directory'=>$p,'mode'=>decoct(fileperms($p)&0777),'file_modes'=>$modes,'verified'=>($report['ok']??false),'database_restored'=>($report['restored_data_matches_snapshot']??false),'restore_test_absent'=>!file_exists($p.'/restore-test')];}else $incomplete++;
           }
           echo json_encode(['ok'=>true,'incomplete_application_attempts_removed'=>$removed,'other_incomplete_attempts'=>$incomplete,'backups'=>$backups,'temporary_probes_remaining'=>count(array_filter(scandir(__DIR__),fn($n)=>preg_match('/^rc-(?:web|restore)-audit-[a-f0-9]{24}\.php$/D',$n)))]);
          }catch(Throwable $e){http_response_code(500);echo '{"ok":false}';}
          CODE
          cat > /tmp/driver.py <<'CODE'
          import os,sys,json,time,secrets,hashlib,ssl,urllib.request,urllib.parse
          from pathlib import Path
          sys.path.insert(0,'deploy')
          from roundcube_audit import Client,NoRedirects
          c=Client(os.environ['WHM_API_TOKEN'])
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirects(),urllib.request.HTTPSHandler(context=ssl.create_default_context()))
          def api(u,m,f,**args):
           p={'api.version':1,'cpanel.user':u,'cpanel.module':m,'cpanel.function':f,**args}
           req=urllib.request.Request('https://server50.romania-webhosting.com:2087/json-api/uapi_cpanel',data=urllib.parse.urlencode(p).encode(),headers={'Authorization':'whm fazenda:'+c.token,'Accept':'application/json'})
           with opener.open(req,timeout=40) as r: v=json.load(r)
           if v.get('metadata',{}).get('result')!=1:raise RuntimeError('whm_failed')
           v=v.get('data',{}).get('uapi',{})
           if v.get('status')!=1 or v.get('errors'):raise RuntimeError('uapi_failed')
           return v.get('data')
          def names(u,root):
           v=api(u,'Fileman','list_files',dir=root)
           if isinstance(v,dict):v=v.get('files')
           if not isinstance(v,list):raise RuntimeError('listing_failed')
           return {x['file'] for x in v}
          def remove(u,root,name):
           if name not in names(u,root):return
           v=c.request('/json-api/cpanel',{'cpanel_jsonapi_user':u,'cpanel_jsonapi_apiversion':2,'cpanel_jsonapi_module':'Fileman','cpanel_jsonapi_func':'fileop','op':'unlink','sourcefiles':root+'/'+name,'doubledecode':0},2)
           if name in names(u,root):raise RuntimeError('temporary_probe_cleanup_failed')
          def safe_error(e):
           if not isinstance(e,urllib.error.HTTPError):return None
           try:
            v=json.loads(e.read(8192))
            return {k:v[k] for k in ('ok','stage','error_class','line') if k in v and isinstance(v[k],(str,int,bool))}
           except Exception:return None
          failed=False
          for u,domain in [('welcome','welcomehostel.pt'),('city','citycenterhostel.pt')]:
           root='/home/'+u+'/public_html/roundcube'; name='rc-web-audit-'+secrets.token_hex(12)+'.php'; token=secrets.token_hex(32)
           source=Path('/tmp/cleanup.php').read_text().replace('__EXPIRY__',str(int(time.time())+600)).replace('__TOKENHASH__',hashlib.sha256(token.encode()).hexdigest()).replace('__MAILBOX__','info@'+domain)
           assert name not in names(u,root)
           try:
            api(u,'Fileman','save_file_content',dir=root,file=name,content=source,from_charset='UTF-8',to_charset='UTF-8')
            req=urllib.request.Request('https://'+domain+'/roundcube/'+name,data=b'',headers={'X-Audit-Token':token})
            with opener.open(req,timeout=90) as r: result=json.load(r)
            if not result.get('ok'):raise RuntimeError('probe_not_successful')
            print('FINAL_INVENTORY='+json.dumps({'installation':u,'result':result},sort_keys=True))
           except Exception as e:
            failed=True
            print('FINAL_INVENTORY='+json.dumps({'installation':u,'ok':False,'error_class':type(e).__name__,'http_status':getattr(e,'code',None),'diagnostic':safe_error(e)}))
           finally:
            remove(u,root,name)
            print('CLEANUP='+json.dumps({'installation':u,'probe_absent':name not in names(u,root)}))
          
          if failed: sys.exit(1)
          CODE
          python3 -m py_compile /tmp/driver.py
          php -l /tmp/cleanup.php
      - name: Verify backup permissions remove only generated incomplete attempts and remove probes
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: python3 /tmp/driver.py
