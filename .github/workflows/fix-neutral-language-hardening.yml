name: Fix neutral language hardening

on:
  push:
    branches:
      - agent/autosave-language-guard-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[neutral-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autosave-language-guard-hardening
          fetch-depth: 0
      - name: Patch LanguageGuard neutral normalization
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/I18n/LanguageGuard.php')
          s = p.read_text()
          old = """        $expectedLanguage = $expectedLanguage === 'en' ? 'en' : 'pt';\n        $oppositeLanguage = $expectedLanguage === 'en' ? 'pt' : 'en';\n\n        // 1. Validate the complete text. A reliable opposite-language result is\n        // enough to reject a wholly wrong-language value.\n        $whole = self::detect($text);\n"""
          new = """        $expectedLanguage = $expectedLanguage === 'en' ? 'en' : 'pt';\n        $oppositeLanguage = $expectedLanguage === 'en' ? 'pt' : 'en';\n        $naturalText = self::naturalText($text);\n        if ($naturalText === '') {\n            return;\n        }\n\n        // 1. Validate the complete natural-language text after removing neutral\n        // technical/brand/loan tokens so they cannot distort the language score.\n        $whole = self::detect($naturalText);\n"""
          if s.count(old) != 1:
              raise SystemExit('assertExpectedLanguage patch target not unique')
          s = s.replace(old, new, 1)

          old = """        $result = self::detect($text);\n        if (($result->language === 'pt' || $result->language === 'en') && $result->isReliable()) {\n"""
          new = """        $naturalText = self::naturalText($text);\n        if ($naturalText === '') {\n            return null;\n        }\n\n        $result = self::detect($naturalText);\n        if (($result->language === 'pt' || $result->language === 'en') && $result->isReliable()) {\n"""
          if s.count(old) != 1:
              raise SystemExit('confidentLanguage patch target not unique')
          s = s.replace(old, new, 1)

          marker = """    /**\n     * Build language evidence from individual words plus contiguous 2- and\n"""
          helper = """    private static function naturalText(string $text): string\n    {\n        $lower = mb_strtolower($text, 'UTF-8');\n        $tokens = preg_split('/[^\\p{L}\\p{N}_-]+/u', $lower, -1, PREG_SPLIT_NO_EMPTY) ?: [];\n        $natural = array_values(array_filter($tokens, [self::class, 'isNaturalLanguageToken']));\n        return implode(' ', $natural);\n    }\n\n"""
          if s.count(marker) != 1:
              raise SystemExit('naturalText insertion marker not unique')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-neutral-language-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ignore neutral tokens in whole-text detection [neutral-ready]'
          git push origin HEAD:agent/autosave-language-guard-hardening
