name: Final remaining email test audit
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-trash-final-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Read remaining test evidence without exposing names or contents
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_trash_final_audit.py
