name: Vendor statistical language detector

on:
  push:
    branches:
      - agent/statistical-language-detector

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[vendor-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/statistical-language-detector
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      - name: Build EN PT detector subset
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          composer init --name=room-check/language-detector-build --no-interaction
          composer require nitotm/efficient-language-detector:3.2.0 --prefer-dist --no-interaction
          cat > build-subset.php <<'PHP'
          <?php
          require __DIR__ . '/vendor/autoload.php';

          use Nitotm\Eld\EldMode;
          use Nitotm\Eld\EldScheme;
          use Nitotm\Eld\LanguageDetector;

          $detector = new LanguageDetector('small', EldScheme::ISO639_1, EldMode::MODE_ARRAY);
          $result = $detector->langSubset(['en', 'pt'], true, true);
          if (!$result->success || !$result->file) {
              fwrite(STDERR, 'Could not build EN/PT language subset: ' . ($result->error ?? 'unknown error') . PHP_EOL);
              exit(1);
          }
          echo $result->file . PHP_EOL;
          PHP
          php build-subset.php

          SRC="$TMPDIR/vendor/nitotm/efficient-language-detector"
          DEST="$GITHUB_WORKSPACE/src/ThirdParty/efficient-language-detector"
          rm -rf "$GITHUB_WORKSPACE/src/ThirdParty/language-detection" "$DEST"
          mkdir -p "$DEST/resources/ngrams/subset"
          cp -R "$SRC/src" "$DEST/src"
          cp -R "$SRC/resources/schemes" "$DEST/resources/schemes"
          cp "$SRC/manual_loader.php" "$DEST/manual_loader.php"
          cp "$SRC/LICENSE" "$DEST/LICENSE"
          cp "$SRC/resources/ngrams/subset/"*.php "$DEST/resources/ngrams/subset/"
          printf '%s\n' 'nitotm/efficient-language-detector v3.2.0' > "$DEST/VERSION"

          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/vendor-statistical-language-detector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Vendor Nito-ELD EN/PT subset [vendor-ready]'
          git push origin HEAD:agent/statistical-language-detector
