name: Receipt PDF release diagnosis
on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/receipt-release-diagnostic.yml
      - deploy/receipt_release_diagnostic.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: management-hub-production
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Test bounded diagnostic output
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_receipt_release_diagnostic.py
      - name: Read exact failed deployment and runtime metadata
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/receipt_release_diagnostic.py
