name: One-off classified WHM log content audit (no deletion)
on:
  push:
    branches: [agent/room-item-assignments]
    paths:
      - .github/workflows/cpanel-log-content-audit-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-cpanel-disk-recovery
  cancel-in-progress: false

jobs:
  classify:
    if: github.ref == 'refs/heads/agent/room-item-assignments'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    environment: management-hub-production
    steps:
      - name: Checkout reviewed production source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Run scoped privacy and read-only tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_log_contents_analysis_once.py -v
      - name: Inspect log classifications without reading mail or modifying files
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          timeout --signal=TERM --kill-after=10s 350s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_log_contents_analysis_once.py

      - name: Read and sanitize one private PHP cron full-log report after deployment
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_cpanel_read_private_full_log_audit_once.py -v
          timeout --signal=TERM --kill-after=10s 750s env PYTHONDONTWRITEBYTECODE=1 python3 deploy/cpanel_read_private_full_log_audit_once.py
