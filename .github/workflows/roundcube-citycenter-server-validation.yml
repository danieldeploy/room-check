name: City Center server transport validation
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-citycenter-server-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-server-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: management-hub-production
    concurrency:
      group: citycenter-smtp2go-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Validate source syntax and transport behavior
        run: |
          php -l deploy/roundcube_citycenter_server_validation.php
          php tests/test_roundcube_citycenter_live.php
          python3 -m unittest discover -s tests -p 'test_roundcube_citycenter*.py'
      - name: Test one send from the actual server and retire the temporary cron
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_citycenter_server_validation.py

# Resume from the accepted private send marker; do not send another message.
