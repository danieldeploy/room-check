name: Final Roundcube legacy settings cleanup
on:
  push:
    branches: [codex/roundcube-server-audit-20261004]
    paths: [.github/workflows/roundcube-legacy-settings-cleanup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    concurrency:
      group: final-roundcube-legacy-settings-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Test static cleanup safety
        run: python3 tests/test_roundcube_remove_legacy_smtp.py
      - name: Validate privately; apply only on manual dispatch
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
          ROUNDCUBE_CLEANUP_APPLY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 deploy/roundcube_legacy_config_cleanup.py
