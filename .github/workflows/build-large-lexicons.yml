name: Build large lexicons

on:
  push:
    branches:
      - agent/translation-recover-large-lexicons
    paths:
      - tools/build-large-lexicons.sh
      - .github/workflows/build-large-lexicons.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/translation-recover-large-lexicons
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build pinned local lexicons
        run: bash tools/build-large-lexicons.sh

      - name: Commit generated lexical resources
        run: |
          if [ -z "$(git status --porcelain -- resources/lexicon/full)" ]; then
            echo "No generated lexicon changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/lexicon/full
          git commit -m "Generate large local PT EN lexicons"
          git push origin HEAD:agent/translation-recover-large-lexicons
