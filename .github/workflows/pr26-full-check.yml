name: PR26 full validation

on:
  push:
    branches:
      - agent/preserve-invalid-language-edits

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-language-edits
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/validation-feedback.js
          if [ -f admin/assets/my2n.js ]; then node --check admin/assets/my2n.js; fi
      - name: Run full tests
        run: |
          php tests/run.php
          php tests/i18n.php
          php tests/static-i18n-audit.php
          php tests/persistent-i18n-boundaries.php
          php tests/bilingual-write-audit.php
          php tests/checklist-autosave-contract.php
          php tests/runtime-i18n-preservation.php
          php tests/assignment-textarea-lock.php
          php tests/validation-feedback-contract.php
          php tests/language-guard-hardening.php
          php tests/autosave-hardening.php
          php tests/invalid-language-edit-preservation.php
