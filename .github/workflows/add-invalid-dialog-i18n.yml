name: Add invalid dialog i18n

on:
  push:
    branches:
      - agent/preserve-invalid-language-edits

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-invalid-language-edits
          fetch-depth: 0
      - name: Apply catalogue update
        run: |
          if git log -1 --format=%B | grep -q '\[dialog-i18n-ready\]'; then exit 0; fi
          python .github/scripts/add-invalid-dialog-i18n.py
          php -l src/I18n/SiteTranslations.php
          php tests/static-i18n-audit.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/I18n/SiteTranslations.php
          git commit -m 'Add invalid edit dialog translations [dialog-i18n-ready]'
          git push origin HEAD:agent/preserve-invalid-language-edits
