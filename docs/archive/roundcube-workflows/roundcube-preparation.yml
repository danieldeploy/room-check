name: Roundcube disabled Sandbox preparation

on:
  pull_request:
    paths:
      - deploy/roundcube_prepare.py
      - tests/test_roundcube_prepare.py
      - .github/workflows/roundcube-preparation.yml
  push:
    branches: [agent/room-item-assignments]
    paths:
      - deploy/roundcube_prepare.py
      - tests/test_roundcube_prepare.py
      - .github/workflows/roundcube-preparation.yml

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_roundcube_*.py' -v

  prepare:
    needs: safety-tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/room-item-assignments' &&
      github.repository == 'danieldeploy/room-check'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: management-hub-production
    concurrency:
      group: management-hub-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm runner PHP is available
        run: php --version
      - name: Verify package, back up privately, and copy disabled configuration
        env:
          WHM_API_TOKEN: ${{ secrets.WHM_API_TOKEN }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/roundcube_prepare.py
